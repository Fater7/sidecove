name: Bug Report
description: Something in Sidecove does not work as it should.
title: "[Bug Report] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The more exactly you can say what you did and what you saw, the sooner it can be fixed.
  - type: checkboxes
    id: duplicates
    attributes:
      label: Existing issues
      options:
        - label: I searched the existing issues and could not find this one.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, in your own words.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the bug, starting from a normal Sidecove window.
      placeholder: |
        1. Open the side panel
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
    validations:
      required: true
  - type: input
    id: sidecove-version
    attributes:
      label: Sidecove version
      description: Shown on the Sidecove card at chrome://extensions.
      placeholder: "X.Y.Z"
    validations:
      required: true
  - type: input
    id: chrome-version
    attributes:
      label: Chrome version
      description: Open chrome://version and copy the first line. Sidecove needs Chrome 116 or later.
      placeholder: "Google Chrome 130.0.6723.92 (Official Build) (arm64)"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15, Windows 11, Ubuntu 24.04, ChromeOS"
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Relevant Sidecove settings
      description: |
        Open Sidecove's settings and list the ones that could matter, with their values. Some settings change how tabs are ordered and grouped, so they often matter.
      placeholder: |
        Show new tabs at the top: on
        Sync spaces to Chrome tab groups: off
        Other settings you changed from the default:
  - type: textarea
    id: media
    attributes:
      label: Screenshots or a short video
      description: Drag and drop images or a screen recording here. A short video is often the quickest way to show a bug.
