name: Release

# A vX.Y.Z tag on main publishes a release. Every pull request runs the same build, checks and
# notes as a dry run, without publishing anything. See CONTRIBUTING.md for the release flow.
# Chrome versions are numbers only, so there are no -rc or -beta prereleases.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ github.ref_type == 'tag' && 'Build release' || 'Release dry run' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and main, for the checks and the changelog link

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check the version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            node scripts/release.js check "$GITHUB_REF_NAME"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "❌ $GITHUB_REF_NAME is not on main"; exit 1; }
          else
            node scripts/release.js check
          fi

      - name: Unit tests
        run: npm run test:unit

      - name: Build extension
        run: npm run build

      - name: Check every file reference in dist/ resolves
        run: npm run verify:dist

      - name: Create zip package
        run: npm run zip

      - name: Write the checksum
        run: |
          sha256sum sidecove-extension.zip > sidecove-extension.zip.sha256
          sha256sum -c sidecove-extension.zip.sha256

      - name: Write the release notes from CHANGELOG.md
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          node scripts/release.js notes "$VERSION" > release-notes.md
          cat release-notes.md

      - name: Keep the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            sidecove-extension.zip
            sidecove-extension.zip.sha256
            release-notes.md
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write

    steps:
      - name: Get the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sidecove-extension.zip

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" sidecove-extension.zip sidecove-extension.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Sidecove ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --verify-tag
